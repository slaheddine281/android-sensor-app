name: stepquest
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase SDK for Flutter (Auth + Database)
  supabase_flutter: ^2.8.0

  # Authentification biométrique native (Face ID / empreinte) sur Android & iOS
  local_auth: ^2.3.0

  # Liaison du Face ID natif au compte enrôlé sur l'appareil
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
